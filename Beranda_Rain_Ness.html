<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beranda · Rain Ness: Video Pendek dari HP</title>
<meta name="theme-color" content="#0a5be0">
<style>
:root{--bg:#f4f8ff;--ink:#0b1f4f;--muted:#4a5f86;--line:#d3e2f8;--brand:#0a5be0;--accent:#00c2ff;--soft:#eaf3ff;--ok:#0a7a4a;--grad:linear-gradient(135deg,#0a3fc4,#0a7cff 60%,#00c2ff);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem}
.logo img{height:32px}.n2{color:var(--brand)}
main{max-width:620px;margin:0 auto;padding:18px 16px;display:grid;gap:18px}
.nb{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.card{background:#fff;border-radius:22px;padding:18px}
h2{font-size:1.35rem;line-height:1.2;margin:8px 0}
h3{font-size:1.05rem;margin:0}
p{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:.86rem}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pill{display:inline-block;background:var(--ink);color:#7be4ff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.8rem}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 20px;background:var(--grad);color:#fff;font-weight:700;text-decoration:none}
.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.guest{background:var(--soft);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ring{flex:none;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring b{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:#fff}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done span.t{color:var(--muted);text-decoration:line-through}
.next .chk{border-color:var(--brand)}
.tag{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--brand)}
.lv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lock{color:var(--muted)}
.days{display:flex;gap:6px;justify-content:space-between;margin:12px 0}
.d{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.d i{display:block;width:100%;aspect-ratio:1;max-width:38px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);background:#fff}
.d.on i{background:var(--grad);border-color:var(--brand)}
.d.today i{border-color:var(--ink)}
.big{font-size:2.2rem;font-weight:800;line-height:1}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;justify-content:space-between;gap:10px;font-weight:700}
summary::after{content:"+"}details[open] summary::after{content:"–"}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:.88rem;max-width:90%;z-index:60}
#toast[hidden]{display:none}
#bnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;background:#fff;border-radius:26px;padding:6px;align-items:flex-end;max-width:600px;margin:0 auto}
#bnav a,#bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;color:var(--ink);text-decoration:none;font-size:.7rem;font-weight:700;background:none;border:0}
#bnav .on{background:#bfe9ff}
#bnav .mid .box{width:58px;height:50px;border-radius:18px;background:var(--accent);border:3px solid var(--ink);display:grid;place-items:center;margin-top:-28px}
#bnav .mid{background:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<div id="toast" role="status" hidden></div>
<script>
(function(){
var LOGIN_URL=""; // isi dengan alamat halaman login Google (project rainness-login)
var MODS=[
["Mulai dari ide",["Ide yang layak ditonton","Satu video, satu pesan","Bank ide mingguan"]],
["Rekam di HP",["Cahaya dan suara","Framing dan gerak kamera","Stok adegan pendukung"]],
["Susun cerita",["Hook tiga detik","Ritme dan potongan","Teks dan subtitle","Musik dan efek suara"]],
["Edit cepat",["Memilih aplikasi edit","Template milikmu sendiri","Ekspor sesuai platform"]],
["Tayang dan evaluasi",["Judul dan thumbnail","Jadwal tayang realistis","Membaca angka penonton"]]];
var TIPS=[
["Tiga detik pertama menentukan","Mulai dengan hasil akhir atau pertanyaan yang memancing, bukan salam pembuka."],
["Suara lebih penting dari gambar","Penonton memaafkan gambar goyang, tapi jarang bertahan kalau suaranya pecah."],
["Satu video, satu pesan","Kalau ada tiga pesan, bagi jadi tiga video. Tiap video lebih fokus dan lebih mudah ditonton sampai habis."],
["Rekam lebih banyak dari yang dipakai","Ambil adegan cadangan dari sudut berbeda supaya potongan tidak monoton."],
["Konsisten kecil mengalahkan sprint","Dua video per minggu yang rutin lebih sehat daripada sepuluh video lalu berhenti."],
["Baca angka, bukan perasaan","Lihat di detik ke berapa penonton pergi, lalu perbaiki bagian itu di video berikutnya."]];
var DN=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],KEY="rn_progress_v1";
var S={done:{},days:[],best:0,tip:0};
try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==="object")S=Object.assign(S,r)}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){saveLocal();if(window.rnSync)window.rnSync(S)}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function streak(){var has={};S.days.forEach(function(x){has[x]=1});var i=has[ds(ago(0))]?0:1,n=0;while(has[ds(ago(i))]){n++;i++}return n}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3500)}
function login(){if(window.rnAuth){window.rnAuth.toggle()}else if(LOGIN_URL){window.open(LOGIN_URL,"_blank","noopener")}else{toast("Login belum siap. Cek koneksi internet lalu muat ulang halaman.")}}
function toggle(k){
  if(S.done[k]){delete S.done[k]}else{S.done[k]=1;var t=ds(new Date());if(S.days.indexOf(t)<0)S.days.push(t)}
  S.best=Math.max(S.best,streak());save();render();
}
function el(id){return document.getElementById(id)}
function render(){
  var total=0,done=0,next=null,modsDone=0;
  MODS.forEach(function(m,i){var c=0;m[1].forEach(function(l,j){total++;if(S.done[i+"-"+j]){done++;c++}else if(!next)next=[i,j]});if(c===m[1].length)modsDone++});
  var pct=Math.round(done/total*100),st=streak();
  // lanjut
  var L=el("lanjut");
  if(next){
    var m=MODS[next[0]],c=0;m[1].forEach(function(l,j){if(S.done[next[0]+"-"+j])c++});
    var rows=m[1].map(function(l,j){var k=next[0]+"-"+j,d=S.done[k],n=(j===next[1]);return '<button class="lrow'+(d?' done':'')+(n?' next':'')+'" data-k="'+k+'" aria-pressed="'+(d?"true":"false")+'"><span class="chk">'+(d?'✓':'')+'</span><span class="t">'+l+'</span>'+(n?'<span class="tag">Berikutnya</span>':'')+'</button>'}).join("");
    L.innerHTML='<span class="pill">Lanjut belajar · Modul '+(next[0]+1)+'</span><h2>'+m[0]+'</h2><p class="small muted">'+c+'/'+m[1].length+' lesson selesai</p>'+rows+'<p style="margin:14px 0 0"><button class="btn" id="go" type="button">Tandai selesai: '+m[1][next[1]]+'</button>'+((next[0]===0&&next[1]===0)?' <a class="btn ghost" href="Lesson_1_Ide_Layak_Ditonton.html">Buka materi</a>':'')+'</p>';
    el("go").onclick=function(){toggle(next[0]+"-"+next[1])};
  }else{L.innerHTML='<span class="pill">Level 1 selesai</span><h2>Semua '+total+' lesson tuntas</h2><p class="muted">Kerja bagus. Saatnya tayangkan karya pertamamu.</p>'}
  // alur
  el("alur").innerHTML='<div class="row"><div><h3>Peta Belajar</h3><p class="small muted">Perjalananmu per level</p></div><div class="ring" style="--p:'+pct+'"><b>'+pct+'%</b></div></div>'+
   '<div class="lv"><span><b>01</b> Dasar Video Pendek</span><b>'+modsDone+'/'+MODS.length+' modul</b></div>'+
   ['Gaya Khas','Tayang Konsisten','Monetisasi'].map(function(n,i){return '<div class="lv lock"><span><b>0'+(i+2)+'</b> '+n+'</span><span>Terkunci</span></div>'}).join("");
  // streak
  var dots="";for(var i=6;i>=0;i--){var d=ago(i),on=S.days.indexOf(ds(d))>=0;dots+='<div class="d'+(on?' on':'')+(i===0?' today':'')+'">'+DN[d.getDay()]+'<i></i></div>'}
  el("streak").innerHTML='<h3>Streak belajar</h3><p style="margin:8px 0 0"><span class="big">'+st+'</span> hari beruntun</p><div class="days" aria-label="7 hari terakhir">'+dots+'</div><p class="small muted" style="margin:0">'+(st?'Rekor '+Math.max(S.best,st)+' hari. Selesaikan 1 lesson hari ini untuk menjaganya.':'Nyalakan api pertamamu hari ini, 1 lesson cukup.')+'</p>';
  // tip
  var t=TIPS[S.tip%TIPS.length];
  el("tip").innerHTML='<span class="pill">Tips hari ini</span><h2>'+t[0]+'</h2><p class="muted">'+t[1]+'</p><button class="btn ghost" id="more" type="button">Tips lain ('+((S.tip%TIPS.length)+1)+'/'+TIPS.length+')</button>';
  el("more").onclick=function(){S.tip=(S.tip+1)%TIPS.length;save();render()};
  // modul
  el("modul").innerHTML='<h3>Semua modul</h3><p class="small muted">'+MODS.length+' modul, '+total+' lesson. Ketuk lesson untuk menandai selesai.</p>'+MODS.map(function(m,i){
    var c=0;m[1].forEach(function(l,j){if(S.done[i+"-"+j])c++});
    return '<details'+(next&&next[0]===i?' open':'')+'><summary><span>0'+(i+1)+' '+m[0]+'</span><span class="small muted">'+c+'/'+m[1].length+'</span></summary>'+m[1].map(function(l,j){var k=i+"-"+j,d=S.done[k];return '<button class="lrow'+(d?' done':'')+'" data-k="'+k+'" aria-pressed="'+(d?"true":"false")+'"><span class="chk">'+(d?'✓':'')+'</span><span class="t">'+l+'</span></button>'}).join("")+'</details>';
  }).join("");
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){toggle(b.getAttribute("data-k"))}});
}
document.querySelectorAll("[data-login]").forEach(function(b){b.addEventListener("click",login)});
var nav=document.querySelectorAll("#bnav [data-nav]");
nav.forEach(function(a){a.addEventListener("click",function(){nav.forEach(function(x){x.classList.remove("on")});a.classList.add("on")})});
function spy(){
  var y=window.scrollY+150,cur="#beranda";
  ["lanjut","alur","streak"].forEach(function(id){var e=document.getElementById(id);if(e&&e.offsetTop<=y)cur="#"+id});
  var near=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-4;if(near)cur="#streak";
  nav.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")===cur)});
}
window.addEventListener("scroll",spy,{passive:true});window.addEventListener("hashchange",function(){setTimeout(spy,50)});
window.addEventListener("pageshow",function(e){if(e.persisted)location.reload()});
window.rnApi={
  toast:toast,
  get:function(){return S},
  merge:function(r,union){
    if(!r||typeof r!=="object")return;
    var rd=(r.done&&typeof r.done==="object")?r.done:{},rdays=Array.isArray(r.days)?r.days:[];
    if(union){
      Object.keys(rd).forEach(function(k){S.done[k]=1});
      rdays.forEach(function(x){if(S.days.indexOf(x)<0)S.days.push(x)});
      S.best=Math.max(S.best||0,r.best||0);
    }else{
      S.done=rd;S.days=rdays.slice();S.best=Math.max(r.best||0,0);
    }
    S.days.sort();saveLocal();render();
  }
};

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Isi dengan konfigurasi dari Firebase Console (sama dengan yang dipakai di halaman login)
const firebaseConfig={apiKey:"AIzaSyB6icdkRO72Mk-CZ6InxJEEFU3Fv-mm44Q",authDomain:"rainness-fbaa4.firebaseapp.com",projectId:"rainness-fbaa4",appId:"1:744508870043:web:282e4921175d495c82253e"};

const api=window.rnApi;
const siap=!Object.values(firebaseConfig).some(v=>v.includes("ISI_DI_SINI"));
let auth,db,user=null,unsub=null,pertama=true,timer=null;

function tampil(){
  const masuk=!!user;
  const g=document.getElementById("guest");if(g)g.hidden=masuk;
  document.querySelectorAll("[data-login]").forEach(b=>{
    const lbl=masuk?"Keluar":(b.closest("#bnav")?"Masuk":(b.closest("#guest")?"Daftar gratis":"Masuk"));
    const sp=b.querySelector("span");
    if(sp)sp.textContent=lbl;else b.textContent=lbl;
  });
}

window.rnAuth={
  async toggle(){
    if(!siap){api.toast("Isi firebaseConfig di kode halaman dulu (lihat README).");return}
    if(user){try{await signOut(auth)}catch(e){api.toast("Gagal keluar: "+(e.code||e.message))}return}
    const provider=new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    try{await signInWithPopup(auth,provider)}
    catch(e){
      if(e.code==="auth/popup-blocked")return signInWithRedirect(auth,provider);
      const pesan={
        "auth/popup-closed-by-user":"Jendela masuk ditutup sebelum selesai.",
        "auth/unauthorized-domain":"Domain ini belum didaftarkan di Authorized domains Firebase."
      };
      api.toast(pesan[e.code]||"Gagal masuk: "+(e.code||e.message));
    }
  }
};

window.rnSync=function(S){
  if(!user||!db)return;
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{
      await setDoc(doc(db,"users",user.uid,"progres","utama"),{
        done:S.done,days:S.days,best:S.best||0,diperbarui:serverTimestamp()
      });
    }catch(e){api.toast("Progres belum tersinkron: "+(e.code||e.message))}
  },600);
};

if(siap){
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}
    user=u;pertama=true;tampil();
    if(!u)return;
    api.toast("Halo, "+(u.displayName||u.email)+". Progresmu ikut akun ini.");
    unsub=onSnapshot(doc(db,"users",u.uid,"progres","utama"),snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(pertama){
        pertama=false;
        if(snap.exists())api.merge(snap.data(),true);
        window.rnSync(api.get());
      }else if(snap.exists()){
        api.merge(snap.data(),false);
      }
    },err=>api.toast("Tidak bisa membaca progres: "+(err.code||err.message)));
  });
}
</script>
